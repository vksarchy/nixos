monitor.bluez.properties = {
  # Fix for Marshall Woburn II (and similar speakers):
  # With both a2dp_sink + a2dp_source roles enabled, the speaker opens a reverse
  # A2DP stream toward the laptop, which leaves AVDTP busy and makes bluetoothd
  # report: "a2dp-sink profile connect failed: Device or resource busy".
  #
  # a2dp_source = this machine SENDS audio (play to speakers/headphones).
  # a2dp_sink   = this machine RECEIVES audio (phone plays through laptop).
  # Speakers only need a2dp_source.
  #
  # Codec order is preference order (first match wins when available).
  bluez5.roles = [ a2dp_source ]
  bluez5.codecs = [ aptx_hd aptx aac sbc_xq sbc ]
}
